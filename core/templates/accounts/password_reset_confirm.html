<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <style>
        /* ===== BASE RESET ===== */
        * { box-sizing: border-box; }
        body {
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #111827;
        }
        
        /* ===== LAYOUT ===== */
        .email-container {
            background: #ffffff !important;
            padding: 60px 20px;
            min-height: 100vh;
        }

        /* Outer wrapper with gradient border effect */
        .email-border-wrapper {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff !important;
            background-color: #ffffff !important;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            border: none;
        }
        
        .email-wrapper {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff !important;
            background-color: #ffffff !important;
            border-radius: 0;
            overflow: visible;
        }

        /* ===== CONTENT AREA ===== */
        .content {
            padding: 0;
            background: #ffffff !important;
            color: #111827;
            line-height: 1.7;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #111827;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #111827;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.25);
        }
        
        .password-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30px;
            
            position: absolute;
            top: 42px;
            right: 15px;
            cursor: pointer;
            color: #6b7280;
        }
        
        .password-requirements {
            margin-top: 8px;
            font-size: 14px;
            color: #6b7280;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .requirement .icon {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .requirement.valid .icon {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .requirement.invalid .icon {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        button {
            background: #111827;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            min-height: 42px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            position: relative;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 24, 39, 0.20);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Loading spinner */
        .spinner {
            display: none;
            position: absolute;
            top: calc(50% - 10px);
            left: calc(50% - 10px);
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            z-index: 10;
        }
        
        button {
            position: relative;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
        }
        
        .success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        .hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-border-wrapper">
            <div class="email-wrapper">
                <!-- MAIN CONTENT -->
                <div class="content">
                    <h1 style="color: #111827; margin-top: 0;">Restablecer contraseña</h1>
                    <p style="color: #4b5563; margin-bottom: 30px;">Por favor ingresa tu nueva contraseña a continuación.</p>
                    
                    <div class="status-message success hide" id="successMessage">
                        Tu contraseña ha sido actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
                    </div>
                    
                    <div class="status-message error hide" id="errorMessage"></div>
                    
                    <form id="passwordResetForm">
                        <div class="form-group">
                            <label for="password1">Nueva contraseña</label>
                            <input type="password" id="password1" name="password1" required>
                            <span class="password-toggle" id="togglePassword1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                            <div class="password-requirements">
                                <div class="requirement" id="req-length">
                                    <span class="icon">✓</span>
                                    <span>Al menos 8 caracteres</span>
                                </div>
                                <div class="requirement" id="req-uppercase">
                                    <span class="icon">✓</span>
                                    <span>Al menos 1 mayúscula</span>
                                </div>
                                <div class="requirement" id="req-lowercase">
                                    <span class="icon">✓</span>
                                    <span>Al menos 1 minúscula</span>
                                </div>
                                <div class="requirement" id="req-number">
                                    <span class="icon">✓</span>
                                    <span>Al menos 1 número</span>
                                </div>
                                <div class="requirement" id="req-special">
                                    <span class="icon">✓</span>
                                    <span>Al menos 1 carácter especial</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password2">Confirmar contraseña</label>
                            <input type="password" id="password2" name="password2" required>
                            <span class="password-toggle" id="togglePassword2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" id="submitButton">
                                <span id="buttonText">Restablecer contraseña</span>
                                <div class="spinner" id="loadingSpinner"></div>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('passwordResetForm');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const password1Input = document.getElementById('password1');
            const password2Input = document.getElementById('password2');
            const togglePassword1 = document.getElementById('togglePassword1');
            const togglePassword2 = document.getElementById('togglePassword2');
            const submitButton = document.getElementById('submitButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // Password requirements elements
            const reqLength = document.getElementById('req-length');
            const reqUppercase = document.getElementById('req-uppercase');
            const reqLowercase = document.getElementById('req-lowercase');
            const reqNumber = document.getElementById('req-number');
            const reqSpecial = document.getElementById('req-special');
            
            // Password validation patterns
            const patterns = {
                length: /.{8,}/,
                uppercase: /[A-Z]/,
                lowercase: /[a-z]/,
                number: /[0-9]/,
                special: /[!@#$%^&*(),.?":{}|<>]/
            };
            
            // Toggle password visibility
            togglePassword1.addEventListener('click', function() {
                togglePasswordVisibility(password1Input, togglePassword1);
            });
            
            togglePassword2.addEventListener('click', function() {
                togglePasswordVisibility(password2Input, togglePassword2);
            });
            
            function togglePasswordVisibility(input, toggle) {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>`;
                } else {
                    input.type = 'password';
                    toggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>`;
                }
            }
            
            // Check password requirements in real-time
            password1Input.addEventListener('input', checkPasswordRequirements);
            
            function checkPasswordRequirements() {
                const password = password1Input.value;
                
                // Check each requirement
                validateRequirement(reqLength, patterns.length.test(password));
                validateRequirement(reqUppercase, patterns.uppercase.test(password));
                validateRequirement(reqLowercase, patterns.lowercase.test(password));
                validateRequirement(reqNumber, patterns.number.test(password));
                validateRequirement(reqSpecial, patterns.special.test(password));
            }
            
            function validateRequirement(element, isValid) {
                if (isValid) {
                    element.classList.add('valid');
                    element.classList.remove('invalid');
                } else {
                    element.classList.add('invalid');
                    element.classList.remove('valid');
                }
            }
            
            function validatePassword(password) {
                let isValid = true;
                let errorMessages = [];
                
                if (!patterns.length.test(password)) {
                    isValid = false;
                    errorMessages.push('La contraseña debe tener al menos 8 caracteres');
                }
                
                if (!patterns.uppercase.test(password)) {
                    isValid = false;
                    errorMessages.push('La contraseña debe contener al menos una letra mayúscula');
                }
                
                if (!patterns.lowercase.test(password)) {
                    isValid = false;
                    errorMessages.push('La contraseña debe contener al menos una letra minúscula');
                }
                
                if (!patterns.number.test(password)) {
                    isValid = false;
                    errorMessages.push('La contraseña debe contener al menos un número');
                }
                
                if (!patterns.special.test(password)) {
                    isValid = false;
                    errorMessages.push('La contraseña debe contener al menos un carácter especial');
                }
                
                return {
                    isValid: isValid,
                    messages: errorMessages
                };
            }
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password1 = password1Input.value;
                const password2 = password2Input.value;
                
                // Reset form and messages
                hideError();
                
                // Validate passwords match
                if (password1 !== password2) {
                    showError('Las contraseñas no coinciden');
                    return;
                }
                
                // Validate password requirements
                const passwordValidation = validatePassword(password1);
                if (!passwordValidation.isValid) {
                    showError(passwordValidation.messages.join('<br>'));
                    return;
                }
                
                // Show loading state
                setLoading(true);
                
                // Send API request
                fetch('/auth/password/reset/confirm/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: '{{ token }}',
                        uid: '{{ uid }}',
                        new_password1: password1,
                        new_password2: password2
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(data => {
                            // Handle specific error responses from the API
                            if (data.new_password2) {
                                throw new Error(data.new_password2.join('<br>'));
                            } else if (data.non_field_errors) {
                                throw new Error(data.non_field_errors.join('<br>'));
                            } else if (data.token) {
                                throw new Error(data.token.join('<br>'));
                            } else if (data.detail) {
                                throw new Error(data.detail);
                            } else {
                                throw new Error('Ha ocurrido un error al restablecer tu contraseña');
                            }
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    form.style.display = 'none';
                    successMessage.classList.remove('hide');
                    setLoading(false);
                })
                .catch(error => {
                    showError(error.message || 'Ha ocurrido un error al restablecer tu contraseña');
                    setLoading(false);
                });
            });
            
            function setLoading(isLoading) {
                const buttonText = document.getElementById('buttonText');
                
                if (isLoading) {
                    submitButton.disabled = true;
                    loadingSpinner.style.display = 'block';
                    buttonText.style.display = 'none';
                } else {
                    submitButton.disabled = false;
                    loadingSpinner.style.display = 'none';
                    buttonText.style.display = 'inline';
                    buttonText.textContent = 'Restablecer contraseña';
                }
            }
            
            function showError(message) {
                errorMessage.innerHTML = message;
                errorMessage.classList.remove('hide');
                errorMessage.scrollIntoView({ behavior: 'smooth' });
            }
            
            function hideError() {
                errorMessage.innerHTML = '';
                errorMessage.classList.add('hide');
            }
            
            // Initialize password requirement checks
            checkPasswordRequirements();
        });
    </script>
</body>
</html>
